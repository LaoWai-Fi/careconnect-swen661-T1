appId: com.example.careconnect
name: Flutter sign in and daily check in
---
- launchApp:
    clearState: true
- tapOn: I already have an account
- tapOn: you@example.com
- inputText: wiliss@example.com
- tapOn: Enter password
- inputText: secure-demo-password
- tapOn: "→  Sign in"
- assertVisible: Dashboard
- takeScreenshot: flutter-dashboard-signed-in
- tapOn: Not yet
- assertVisible: "✓ Check-in recorded!"
- takeScreenshot: flutter-check-in-recorded
