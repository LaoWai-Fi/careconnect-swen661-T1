appId: com.careconnect.mobile
name: React Native sign in and daily check in
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: I already have an account
    timeout: 20000
- waitForAnimationToEnd
- tapOn: I already have an account
# Never use hideKeyboard in these flows: on Android it sends BACK, which
# leaves the screen when no soft keyboard is showing. Enter on a single-line
# React Native input blurs it and closes the keyboard instead.
- tapOn: you@example.com
- inputText: wiliss@example.com
- pressKey: Enter
- tapOn: Enter password
- inputText: secure-demo-password
- pressKey: Enter
- tapOn: Sign in
- extendedWaitUntil:
    visible: Dashboard
    timeout: 10000
- takeScreenshot: rn-dashboard-signed-in
- scrollUntilVisible:
    element: Not yet
    direction: DOWN
- tapOn: Not yet
# Feedback clears itself after 3 s, so assert and capture right away.
- assertVisible: "✓ Check-in recorded!"
- takeScreenshot: rn-check-in-recorded
