appId: com.careconnect.mobile
name: React Native sign in and daily check in
---
- launchApp:
    clearState: true
- tapOn: I already have an account
- tapOn: you@example.com
- inputText: wiliss@example.com
- tapOn: Enter password
- inputText: secure-demo-password
- hideKeyboard
- tapOn: Sign in
- assertVisible: Dashboard
- takeScreenshot: rn-dashboard-signed-in
- tapOn: Not yet
- assertVisible: "✓ Check-in recorded!"
- takeScreenshot: rn-check-in-recorded
