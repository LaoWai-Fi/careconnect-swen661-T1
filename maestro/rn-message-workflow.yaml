appId: com.careconnect.mobile
name: React Native compose a caregiver message
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: I already have an account
    timeout: 20000
- waitForAnimationToEnd
- tapOn: I already have an account
# Never use hideKeyboard in these flows: on Android it sends BACK, which
# leaves the screen when no soft keyboard is showing. Enter on a single-line
# React Native input blurs it and closes the keyboard instead.
- tapOn: you@example.com
- inputText: wiliss@example.com
- pressKey: Enter
- tapOn: Enter password
- inputText: secure-demo-password
- pressKey: Enter
- tapOn: Sign in
- extendedWaitUntil:
    visible: Dashboard
    timeout: 10000
- tapOn: Messages
- assertVisible: Messages
- takeScreenshot: rn-messages-before-compose
# The button label starts with an emoji; match the text part only.
- tapOn: ".*New Message"
# Fill top-to-bottom so the keyboard never scrolls the recipient out of view.
- tapOn: 'e\.g\. Sarah \(daughter\)'
- inputText: Sarah
- pressKey: Enter
- tapOn: e.g. Margaret's visit summary
- inputText: Visit update
- pressKey: Enter
- tapOn: Write your update…
- inputText: Margaret is doing well today.
# This Back follows a focused multiline field with its keyboard open. Unlike
# the single-line fields above, Enter here would add a newline.
- pressKey: Back
- tapOn: Send
# New messages are added to the top of the inbox.
- assertVisible: ".*Visit update.*"
- takeScreenshot: rn-message-sent
