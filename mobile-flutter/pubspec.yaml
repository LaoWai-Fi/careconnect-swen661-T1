name: careconnect
description: >-
  CareConnect mobile app (SWEN 661 Team 1) — a caregiving companion app with a
  Left-Hand Mode accessibility focus, built from the team's Week 3 Figma design
  system. Phone and tablet layouts, WCAG 2.2 AA tap targets, no drag-only
  actions, and visible focus states.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Week 4): AppState is a ChangeNotifier wired through
  # the app via ChangeNotifierProvider/context.watch instead of a hand-rolled
  # addListener + setState at the app root. See lib/main.dart.
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Used to mock callback dependencies in widget tests (e.g. verifying a
  # button's onPressed is invoked exactly once) without relying on AppState
  # side effects to observe the interaction.
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
