name: Desktop Electron

on:
  push:
    branches: [feat/electron-buiild-wk8, main]
    paths:
      - "desktop-electron/**"
      - ".github/workflows/desktop-electron.yml"
  pull_request:
    branches: [feat/electron-buiild-wk8, main]
    paths:
      - "desktop-electron/**"
      - ".github/workflows/desktop-electron.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop-electron

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: desktop-electron/coverage/lcov-report
      - run: xvfb-run -a npm run test:e2e

  package:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 is GitHub's Intel runner. If GitHub retires it, drop this row
          # and use dist:mac on macos-latest, which cross-builds x64 as well.
          - os: macos-13
            label: macOS-Intel
            script: dist:mac:intel
            files: |
              desktop-electron/release/*.dmg
              desktop-electron/release/*.zip
          - os: macos-latest
            label: macOS-AppleSilicon
            script: dist:mac:arm
            files: |
              desktop-electron/release/*.dmg
              desktop-electron/release/*.zip
          - os: windows-latest
            label: Windows
            script: dist:win
            files: desktop-electron/release/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json
      - run: npm ci
      - name: Verify the app on macOS (primary platform)
        if: runner.os == 'macOS'
        run: npm run test:e2e
      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: CareConnect-${{ matrix.label }}
          path: ${{ matrix.files }}
          if-no-files-found: error
