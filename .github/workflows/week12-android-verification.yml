name: Week 12 final Android workflow evidence
on:
  push:
    branches: [feat/wiliss-wk12-integration-delivery]
    paths: [maestro/**, .github/workflows/week12-android-verification.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify-release-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          run-id: 41395085788
          github-token: ${{ github.token }}
          pattern: Week12-*
          path: artifacts/builds
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o "$RUNNER_TEMP/install-maestro.sh"
          bash "$RUNNER_TEMP/install-maestro.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install artifacts/builds/Week12-Flutter/CareConnect-Flutter-Week12.apk
            adb install artifacts/builds/Week12-ReactNative/CareConnect-ReactNative-Week12.apk
            mkdir -p artifacts/android-e2e
            maestro test --format junit --output artifacts/android-e2e/results.xml --test-output-dir artifacts/android-e2e/output --debug-output artifacts/android-e2e/output maestro/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Week12-Android-Final-Evidence
          path: artifacts/android-e2e
